name: Publish GitHub Pages
# main is the public site and moves only to numbered releases (see "Deployment"
# in the README); work on other branches only validates, in "Checks".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # scripts/hooks/pre-push refuses anything else from a clone that has it installed.
      # This covers the other ways onto main, such as a pull request merged there on GitHub.
      - name: Publish only a numbered release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tagged=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}" | tail -n 1 | cut -f 1)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            where="is at $tagged"
            [ -n "$tagged" ] || where="is not on GitHub"
            echo "::error::main is at $GITHUB_SHA, but the tag v$version named by its VERSION $where. Only a release cut by scripts/release.py is published; see Deployment in the README."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Same checks as the "Checks" workflow; the reproducibility rebuild leaves dist/ ready.
      # COVERAGE makes them record which code they run (see "Test coverage" in the README).
      - run: bash scripts/check_all.sh
        env:
          COVERAGE: ${{ runner.temp }}/coverage
      # After the checks, because every build clears dist/: the release and coverage badges the README shows.
      - name: Show the test coverage and add the README badges to the site
        run: |
          python scripts/code_coverage.py "$RUNNER_TEMP/coverage" --markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/badges.py "$RUNNER_TEMP/coverage" dist/badges
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
