name: Checks
# Every branch except main, and pull requests: the full check set.
# main runs the same checks in "Publish GitHub Pages" before deploying.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # COVERAGE makes the checks record which code they run (see "Test coverage" in the README).
      - run: bash scripts/check_all.sh
        env:
          COVERAGE: ${{ runner.temp }}/coverage
      - name: Show the test coverage in the run summary
        run: python scripts/code_coverage.py "$RUNNER_TEMP/coverage" --markdown >> "$GITHUB_STEP_SUMMARY"
